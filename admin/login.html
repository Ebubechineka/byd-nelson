<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — BYD Nelson</title>
<link rel="icon" href="../favicon.png">
<style>
  :root{--byd:#003CBE;--ink:#0d1117;--muted:#6b7280;--line:#e5e7eb;--bg:#f6f7f9}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 40px rgba(16,24,40,.08);
        width:100%;max-width:400px;padding:36px 32px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brand .dot{width:34px;height:34px;border-radius:9px;background:var(--byd);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
  .brand b{font-size:15px;letter-spacing:.2px}
  .brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;letter-spacing:.4px;text-transform:uppercase}
  h1{font-size:21px;margin:0 0 6px}
  p.sub{margin:0 0 24px;color:var(--muted);font-size:13.5px;line-height:1.5}
  label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:#374151}
  input[type=password]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;font-size:14px;outline:none;transition:.15s}
  input[type=password]:focus{border-color:var(--byd);box-shadow:0 0 0 3px rgba(0,60,190,.12)}
  button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:9px;background:var(--byd);color:#fff;
         font-size:14px;font-weight:600;cursor:pointer;transition:.15s}
  button:hover{background:#0032a0}
  .err{display:none;margin-top:14px;padding:10px 12px;border-radius:8px;background:#fef2f2;border:1px solid #fecaca;
       color:#b91c1c;font-size:13px}
  .err.show{display:block}
  .foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6}
  .foot code{background:#f3f4f6;padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="dot">BYD</div>
    <div><b>BYD Nelson</b><span>Content Admin</span></div>
  </div>

  <h1>Sign in</h1>
  <p class="sub">Enter the admin password to manage cars and news.</p>

  <form id="f" autocomplete="off">
    <label for="pw">Password</label>
    <input id="pw" type="password" placeholder="••••••••" autofocus required>
    <button type="submit">Sign in</button>
    <div class="err" id="err">Incorrect password. Please try again.</div>
  </form>

  <div class="foot">
    The password is stored in <code>admin/config.json</code> — edit that file to change it.
  </div>
</div>

<script>
const KEY = 'byd_admin_session';

(async function () {
  // already signed in? go straight through
  if (sessionStorage.getItem(KEY) === 'ok') { location.replace('index.html'); return; }

  let cfg = { password: 'changeme123' };
  try {
    const r = await fetch('config.json', { cache: 'no-store' });
    if (r.ok) cfg = await r.json();
  } catch (e) { /* fall back to default */ }

  document.getElementById('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    const val = document.getElementById('pw').value;
    if (val === cfg.password) {
      sessionStorage.setItem(KEY, 'ok');
      location.href = 'index.html';
    } else {
      document.getElementById('err').classList.add('show');
      document.getElementById('pw').select();
    }
  });
})();
</script>
</body>
</html>
